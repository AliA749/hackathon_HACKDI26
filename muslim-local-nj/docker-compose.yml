services:
  db:
    image: postgres:16-alpine
    container_name: muslim-local-nj-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: muslim_local_nj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - muslim-local-nj-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  muslim-local-nj-db-data:

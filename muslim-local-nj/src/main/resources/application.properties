spring.application.name=muslim-local-nj

# Default datasource: a file-backed H2 database under ./data. Chosen so that a
# clean checkout runs with one command and zero prerequisites - no Docker
# daemon, no Postgres server, no env vars. File-backed (not in-memory) so pins
# posted during a demo survive a restart.
#
# DB_FILE lets teammates keep their own scratch database without stepping on
# each other, e.g. DB_FILE=./data/vertwo.
#
# AUTO_SERVER=TRUE allows a second process (an H2 console, a CLI dump) to open
# the same file while the app holds it, instead of failing on the file lock.
spring.datasource.url=jdbc:h2:file:${DB_FILE:./data/muslim-local-nj};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Run with `--spring.profiles.active=postgres` for the Postgres/docker-compose
# setup instead (see application-postgres.properties).

# Hackathon-speed schema management. Swap for Flyway/Liquibase before this
# ever sees real users.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pure overhead for a local app. Deliberately NOT using
# spring.main.lazy-initialization here: it makes the "Started" line print
# sooner but pushes the same work onto the first API call, and defers config
# errors until a user triggers them instead of at boot.
spring.jmx.enabled=false

# Origins allowed to call /api/** (comma separated). The Vite dev server also
# proxies /api itself, so this mostly matters for `vite preview` or teammates
# running the frontend on a different port.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

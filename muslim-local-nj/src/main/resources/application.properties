spring.application.name=muslim-local-nj

# Postgres (see docker-compose.yml for a local dev instance).
# Override any of these with real env vars in your shell / .env before running.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:muslim_local_nj}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hackathon-speed schema management. Swap for Flyway/Liquibase before this
# ever sees real users.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origins allowed to call /api/** (comma separated). The Vite dev server also
# proxies /api itself, so this mostly matters for `vite preview` or teammates
# running the frontend on a different port.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Postgres profile. Activate with:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=postgres"
# after `docker compose up -d` (see docker-compose.yml).
#
# The default profile uses file-backed H2 instead, so the app starts with no
# external services running. Use this one when you need a real server:
# concurrent writers, a shared team database, or a production-like deploy.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:muslim_local_nj}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
